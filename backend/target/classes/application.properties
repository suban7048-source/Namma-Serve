server.port=${PORT:8080}
server.servlet.context-path=/

# App Name
spring.application.name=localfix-backend

# H2 In-Memory Database (zero-config local execution)
spring.datasource.url=jdbc:h2:mem:localfixdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console.
# Off by default: it is an unauthenticated SQL client against the live database,
# and SecurityConfig only opens /h2-console/** when this is true. Switch it on
# for a local debugging session with:
#   LOCALFIX_H2_CONSOLE=true ./mvnw spring-boot:run
spring.h2.console.enabled=${LOCALFIX_H2_CONSOLE:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Security
# The default below is a development-only key. Any real deployment must set
# LOCALFIX_JWT_SECRET (>=64 chars) in the environment — a signing key committed
# to the repository lets anyone who can read it mint tokens for any account.
localfix.jwt.secret=${LOCALFIX_JWT_SECRET:dev-only-insecure-key-9a3b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b}
localfix.jwt.expiration-ms=${LOCALFIX_JWT_EXPIRY_MS:86400000}

# Error responses must not echo stack traces or messages to the browser;
# GlobalExceptionHandler logs the detail instead.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# CORS Allowed Origins
localfix.cors.allowed-origins=${LOCALFIX_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
