# Production profile — activated with SPRING_PROFILES_ACTIVE=prod.
#
# The in-memory H2 database used for local development is wiped on every
# restart, and Render restarts services on each deploy and after idle spin-down.
# Anything that must survive a deploy has to live in Postgres.

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Fine for this stage; move to Flyway or Liquibase before real data exists,
# because ddl-auto will not perform destructive migrations for you.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Never expose the SQL console on a public host.
spring.h2.console.enabled=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.root=INFO
logging.level.com.localfix=INFO
